[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-context-mcp"
version = "0.2.0"
description = "Read-only Python repository context over MCP stdio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["mcp==2.3.0"]

[project.scripts]
repo-context-mcp = "repocontext.__main__:main"

[tool.setuptools.packages.find]
include = ["repocontext*"]
